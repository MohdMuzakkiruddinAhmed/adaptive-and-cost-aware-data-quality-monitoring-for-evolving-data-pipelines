name: Artifact and synthetic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    name: Verify released evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify source, evidence, and provenance
        run: |
          python release_tools/verify_release.py
          python -m unittest discover -s release_tools/tests -v

  synthetic-tests:
    name: Synthetic tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ADQ_TFDV_PYTHON: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: adaptive-data-quality/pyproject.toml
      - name: Install portable test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./adaptive-data-quality[dev]"
      - name: Run offline synthetic tests
        working-directory: adaptive-data-quality
        run: python -m pytest -q -p no:cacheprovider


