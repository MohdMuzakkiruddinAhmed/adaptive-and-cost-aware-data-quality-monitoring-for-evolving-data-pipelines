name: Software bug
description: Report an implementation or packaging problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete behaviour and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include command, environment, expected behaviour and redacted error.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials and private data.
          required: true

