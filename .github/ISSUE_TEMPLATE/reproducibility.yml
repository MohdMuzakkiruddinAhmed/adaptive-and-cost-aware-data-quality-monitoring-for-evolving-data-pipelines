name: Reproducibility report
description: Report a mismatch between a released artifact and a documented result.
title: "[Reproduction] "
body:
  - type: input
    id: release
    attributes:
      label: Release or commit
      description: Include source and companion-asset versions.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, packages and optional sidecars.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and inputs
      description: Include dataset, split, seed, scenario and configuration. Omit secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
      description: Identify the paper table, metric and redacted error.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials and unnecessary personal data.
          required: true

