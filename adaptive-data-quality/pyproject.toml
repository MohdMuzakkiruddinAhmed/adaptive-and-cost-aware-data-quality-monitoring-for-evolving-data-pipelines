[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-data-quality"
version = "0.1.0"
description = "Adaptive and cost-aware data quality management for evolving cloud data pipelines (research prototype)"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Muzakkiruddin Ahmed Mohammed", email = "mmohammed6@ualr.edu"},
    {name = "Ahsan Shahid", email = "axshahid@ualr.edu"},
    {name = "Selimhan Dagtas", email = "sedagtas@ualr.edu"},
    {name = "John Talburt", email = "jrtalburt@ualr.edu"},
    {name = "Abdelrahman Elfikky", email = "aelfikky1@ualr.edu"},
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "pyarrow>=10",
    "pyyaml>=6",
    "openpyxl>=3.0",
    "matplotlib>=3.5",
    "scipy>=1.10",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["boto3>=1.40"]

[tool.setuptools.packages.find]
include = ["profiling*", "ingestion*", "common*", "injection*", "rules*", "drift*", "adaptation*", "execution*", "risk*", "optimizer*", "experiments*", "baselines*", "monitor*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
