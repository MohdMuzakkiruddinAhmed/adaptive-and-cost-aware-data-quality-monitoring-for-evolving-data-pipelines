# Manually authored domain rules (RQ2 / H2a manual-rule condition and H2b manual category guard).
#
# PURPOSE. Separates the value of domain knowledge from the value of LLM-assisted drafting (manuscript
# Sections 2.4 and 6.4). The rules use the SAME permitted information as the LLM prompt: the dataset and
# column descriptions in configs/datasets.yaml, statistics and examples from the development (training)
# pool, and generally known public code lists (US state codes, country names, published category lists).
# They never use evaluation records, the semantic-defect list, or the novelty values.
#
# !! REVIEW BEFORE CONFIRMATORY USE !!
# This first draft was written by Claude, which had seen the injected semantic-defect definitions in
# datasets.yaml. That is a bias risk for the manual condition. Before the protocol is frozen, these rules
# should be rewritten or at least independently reviewed by someone who has NOT seen the semantic defects
# or the novelty values in protocol.yaml, and the reviewer's changes recorded here. The draft was also
# checked once against the whole cleaned source (0 failures for every rule); that check included
# test-pool records, so the reviewer should recheck on the development pool only.
#
# FORMAT. Same fields as the LLM rule proposals, so manual and LLM rules go through identical code:
#   column, rule_type (range | category | pattern | completeness | type | uniqueness), min, max,
#   allowed_values, pattern (whole-value regular expression), condition, provenance
# Category/pattern rules on a column are also its domain constraints in the H2b category guard; a column
# with only a pattern constraint is an OPEN domain (a well-formed unknown value is compatible, not valid).

author: "Claude (draft, 2026-10-04), pending independent review"
validate_manual: false        # true = manual rules also pass the warm-up admission checks (Section 5.2)

rules:
  bts_airline:
    - {column: DepDelay, rule_type: type, condition: "numeric", provenance: "description: minutes"}
    - {column: TaxiOut, rule_type: range, min: 0, max: null,
       condition: "taxi-out time is not negative", provenance: "description: a duration in minutes"}
    - {column: AirTime, rule_type: range, min: 0.000001, max: null,
       condition: "airborne time is positive", provenance: "description: a flown (non-cancelled, non-diverted) flight has airborne time"}
    - {column: Distance, rule_type: range, min: 0.000001, max: null,
       condition: "distance between two airports is positive", provenance: "description: distance in miles"}
    - {column: Reporting_Airline, rule_type: pattern, pattern: "[A-Z0-9]{2}",
       condition: "two-character IATA carrier code", provenance: "description"}
    - {column: Reporting_Airline, rule_type: category,
       allowed_values: [AA, AS, B6, DL, F9, G4, HA, MQ, NK, OH, OO, UA, WN, YX, 9E],
       condition: "carriers reporting on-time data to BTS in 2024",
       provenance: "public list: BTS Reporting Carrier On-Time Performance carriers, 2024"}
    - {column: Origin, rule_type: pattern, pattern: "[A-Z]{3}",
       condition: "three-letter IATA airport code (open domain: no airport list used)", provenance: "description"}
    - {column: OriginState, rule_type: category,
       allowed_values: [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA,
                        MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX,
                        UT, VT, VA, WA, WV, WI, WY, PR, VI, GU, AS, MP, TT],
       condition: "US state, DC or territory code",
       provenance: "public list: USPS state and territory codes; TT = BTS code for US Pacific trust territories"}
    - {column: _records, rule_type: uniqueness, condition: "no repeated flight record", provenance: "description: one record per flight"}

  online_retail:
    - {column: Quantity, rule_type: range, min: 1, max: null,
       condition: "units sold on a sales line are positive", provenance: "description: sales only, returns removed"}
    - {column: Price, rule_type: range, min: 0.000001, max: null,
       condition: "unit price of a sale is positive", provenance: "description: unit price, sales only"}
    - {column: StockCode, rule_type: pattern, pattern: "[0-9]{5}[A-Za-z]{0,2}|[A-Za-z][A-Za-z0-9 _]*",
       condition: "five-digit product code with optional letters, or an alphabetic service code (e.g. POST)",
       provenance: "description + training examples (service codes such as POST, DOT, M)"}
    - {column: Country, rule_type: category,
       allowed_values: [Afghanistan, Albania, Algeria, Andorra, Angola, Antigua and Barbuda, Argentina, Armenia,
                        Australia, Austria, Azerbaijan, Bahamas, Bahrain, Bangladesh, Barbados, Belarus, Belgium,
                        Belize, Benin, Bermuda, Bhutan, Bolivia, Bosnia and Herzegovina, Botswana, Brazil, Brunei,
                        Bulgaria, Burkina Faso, Burundi, Cambodia, Cameroon, Canada, Cape Verde,
                        Central African Republic, Chad, Chile, China, Colombia, Comoros, Congo, Costa Rica,
                        Croatia, Cuba, Cyprus, Czech Republic, Denmark, Djibouti, Dominica, Dominican Republic,
                        Ecuador, Egypt, El Salvador, Equatorial Guinea, Eritrea, Estonia, Eswatini, Ethiopia, Fiji,
                        Finland, France, Gabon, Gambia, Georgia, Germany, Ghana, Greece, Greenland, Grenada,
                        Guatemala, Guinea, Guyana, Haiti, Honduras, Hong Kong, Hungary, Iceland, India, Indonesia,
                        Iran, Iraq, Ireland, Israel, Italy, Jamaica, Japan, Jordan, Kazakhstan, Kenya, Korea,
                        Kuwait, Kyrgyzstan, Laos, Latvia, Lebanon, Lesotho, Liberia, Libya, Liechtenstein,
                        Lithuania, Luxembourg, Macau, Madagascar, Malawi, Malaysia, Maldives, Mali, Malta,
                        Mauritania, Mauritius, Mexico, Moldova, Monaco, Mongolia, Montenegro, Morocco, Mozambique,
                        Myanmar, Namibia, Nepal, Netherlands, New Zealand, Nicaragua, Niger, Nigeria,
                        North Macedonia, Norway, Oman, Pakistan, Panama, Papua New Guinea, Paraguay, Peru,
                        Philippines, Poland, Portugal, Qatar, Romania, Russia, Rwanda, Saudi Arabia, Senegal,
                        Serbia, Seychelles, Sierra Leone, Singapore, Slovakia, Slovenia, Somalia, South Africa,
                        Spain, Sri Lanka, Sudan, Suriname, Sweden, Switzerland, Syria, Taiwan, Tanzania, Thailand,
                        Togo, Trinidad and Tobago, Tunisia, Turkey, Uganda, Ukraine, United Arab Emirates,
                        United Kingdom, United States, Uruguay, Uzbekistan, Venezuela, Vietnam, Yemen, Zambia,
                        Zimbabwe,
                        # the dataset's own naming conventions, seen in the training examples
                        EIRE, RSA, USA, Channel Islands, European Community, West Indies, Unspecified],
       condition: "a country name (English short name) or one of the dataset's naming conventions",
       provenance: "public list: English short country names (ISO 3166 style) + conventions in training data"}
    - {column: _records, rule_type: uniqueness, condition: "no repeated invoice line", provenance: "description: one record per invoice line"}

  chicago_food:
    - {column: Latitude, rule_type: range, min: 41.6, max: 42.1,
       condition: "inside the City of Chicago", provenance: "public: city limits approx. 41.64-42.02 N"}
    - {column: Longitude, rule_type: range, min: -88.0, max: -87.5,
       condition: "inside the City of Chicago", provenance: "public: city limits approx. 87.52-87.94 W"}
    - {column: Risk, rule_type: category, allowed_values: ["Risk 1 (High)", "Risk 2 (Medium)", "Risk 3 (Low)", "All"],
       condition: "published risk categories", provenance: "Chicago Data Portal field description + training values"}
    - {column: Results, rule_type: category,
       allowed_values: [Pass, Pass w/ Conditions, Fail, Out of Business, No Entry, Not Ready, Business Not Located],
       condition: "published inspection outcomes", provenance: "Chicago Data Portal field description"}
    # Facility Type: open domain (hundreds of free-text types); no manual constraint is written, so the
    # H2b manual guard cannot resolve new values of this column (reported as "unresolved").
    - {column: _records, rule_type: uniqueness, condition: "no repeated inspection record", provenance: "description: one record per inspection"}
